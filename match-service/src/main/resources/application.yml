server:
  port: 8084

spring:
  application:
    name: match-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/team_management}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        default_schema: match
        format_sql: true

    show-sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

services:
  team-service:
    base-url: ${TEAM_SERVICE_BASE_URL:http://localhost:8082}
  tournament-service:
    base-url: ${TOURNAMENT_SERVICE_BASE_URL:http://localhost:8085}

app:
  kafka:
    topics:
      match-events: match-service.match-events

opponent-analysis:
  fla:
    base-url: ${FLA_BASE_URL:https://www.football-loisir-amateur.com}
    connect-timeout: 5s
    read-timeout: 20s
    snapshot-ttl: ${FLA_SNAPSHOT_TTL:6h}
  ai:
    provider: openrouter
    base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
    api-key: ${OPENROUTER_API_KEY:}
    model: ${OPENROUTER_MODEL:}
    connect-timeout: 5s
    read-timeout: 45s
    max-output-tokens: ${OPENROUTER_MAX_OUTPUT_TOKENS:8192}
    temperature: 0.2
    prompt-version: v1
    reasoning-enabled: ${OPENROUTER_REASONING_ENABLED:false}
